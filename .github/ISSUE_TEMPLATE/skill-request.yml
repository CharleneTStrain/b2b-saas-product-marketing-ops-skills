name: Skill request
description: Suggest a new product marketing ops skill or an improvement to one
labels: ["skill request"]
body:
  - type: input
    id: job
    attributes:
      label: The job
      description: What recurring product marketing ops task should an agent handle?
      placeholder: "e.g. Turn a quarter of win/loss notes into a pricing recommendation"
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: What you'd hand it
      description: Decks, call recordings, CRM exports, docs — what goes in?
  - type: textarea
    id: output
    attributes:
      label: What you'd want back
      description: The finished thing, as specifically as you can describe it
  - type: input
    id: existing
    attributes:
      label: Closest existing skill
      description: If one of the current skills almost does this, which one?
